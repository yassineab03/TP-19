server.port=8089
spring.application.name=SERVICE-VOITURE
spring.cloud.discovery.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.url=jdbc:h2:mem:voitures;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.cloud.openfeign.client.config.SERVICE-CLIENT.connectTimeout=3000
spring.cloud.openfeign.client.config.SERVICE-CLIENT.readTimeout=5000
management.endpoints.web.exposure.include=health,info
